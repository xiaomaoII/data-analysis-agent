[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "business-data-agent"
version = "0.1.0"
description = "Evidence-grounded livestream business analysis agent"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "uvicorn[standard]", "streamlit", "langgraph", "duckdb", "pydantic", "pandas", "numpy", "sqlglot", "plotly", "jinja2", "httpx", "python-dotenv"]

[project.optional-dependencies]
test = ["pytest", "ruff"]

[project.scripts]
data-agent = "data_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
